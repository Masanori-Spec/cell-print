name: Verify CellPrint offline export
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  export-and-print:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-native.txt
      - run: npm run verify
      - run: python scripts/native-consumer.py
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk fonts-noto-color-emoji
      - run: npm run test:browser
      - name: Consume the actual browser downloads
        run: python scripts/consume-downloads.py
      - run: python scripts/check-pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            evidence/
            dist/
            test-results/
            playwright-report/
          if-no-files-found: error
